background {
    monitor =
    path = ~/Pictures/Wallpapers/serpantinum-wallpaper.jpg
    blur_passes = 0
}

input-field {
    monitor =
    size = 250, 40
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgba(255, 165, 0, 1.0)
    inner_color = rgba(0, 0, 0, 0.8)
    font_color = rgb(255, 255, 255)
    fade_on_empty = false
    placeholder_text = <i>Password...</i>
    hide_input = false
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = monospace
    color = rgba(255, 255, 255, 1.0)
    position = 0, 100
    halign = center
    valign = center
}
