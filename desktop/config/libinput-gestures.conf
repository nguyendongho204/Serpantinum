# Vuốt 4 ngón sang trái: kéo chọn vùng -> lưu file + copy clipboard
gesture swipe left 4 sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; TARGET="$HOME/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png"; grim -g "$(slurp)" - | tee "$TARGET" | wl-copy -t image/png && notify-send "Đã chụp màn hình" "Đã lưu và copy vào clipboard"'

# Vuốt 4 ngón sang phải: chụp toàn màn hình -> lưu file + copy clipboard
gesture swipe right 4 sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; TARGET="$HOME/Pictures/Screenshots/screenshot_$(date +%Y%m%d_%H%M%S).png"; grim - | tee "$TARGET" | wl-copy -t image/png && notify-send "Đã chụp màn hình" "Đã lưu và copy vào clipboard"'

# Vuốt 3 ngón lên/xuống: tăng/giảm âm lượng liên tục (touchpad-volume.service)

# Pinch 3 ngón tách ra: chia đôi -> toàn màn hình
gesture pinch out 3 "$HOME/.config/hypr/pinch-fullscreen.sh" out

# Pinch 3 ngón chụm vào: toàn màn hình -> chia đôi
gesture pinch in 3 "$HOME/.config/hypr/pinch-fullscreen.sh" in
