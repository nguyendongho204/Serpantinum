# Đơn vị gốc (từ gói) có WantedBy=graphical-session.target. Session này chạy qua
# SDDM -> /usr/bin/start-hyprland (không qua uwsm) nên target đó KHÔNG BAO GIỜ
# kích hoạt -> service không tự start. Nó được nạp lại từ config/autostart.lua
# qua ~/.config/hypr/autostart-start-gestures.sh (import WAYLAND env rồi start).
#
# Phần này chỉ vá 1 chỗ cho chắc khi boot:
[Service]
# Bản gốc KHÔNG có Restart=. Nếu touchpad chưa kịp hiện ở /dev/input lúc
# autostart chạy, libinput-gestures fail và sẽ không bao giờ tự quay lại.
# always để cả trường hợp thoát sạch (exit 0) cũng được khởi động lại.
Restart=always
RestartSec=2
